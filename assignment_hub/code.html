<div class="flex items-center gap-md">

<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors duration-200 active:scale-95">

</button>
</header>

<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Assignment Hub</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Create and manage your interactive lessons.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Card 1: Activity -->
<button class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex items-center gap-md hover:shadow-[0px_8px_24px_rgba(0,0,0,0.08)] transition-all duration-300 active:scale-[0.98] group text-left border border-transparent hover:border-surface-variant">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 flex-shrink-0">
<span class="material-symbols-outlined text-[28px]" data-icon="local_activity">local_activity</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface">Activity</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Interactive tasks and exercises</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors duration-300" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Card 2: Reading Coach -->

<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 flex-shrink-0">

</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface">Reading Coach</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">AI-assisted reading fluency</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors duration-300" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Card 3: MCQ Builder -->
<button class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex items-center gap-md hover:shadow-[0px_8px_24px_rgba(0,0,0,0.08)] transition-all duration-300 active:scale-[0.98] group text-left border border-transparent hover:border-surface-variant">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300 flex-shrink-0">

</div>

</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors duration-300" data-icon="chevron_right">chevron_right</span>

</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors duration-300" data-icon="chevron_right">chevron_right</span>

<span class="material-symbols-outlined mb-1" data-icon="menu_book">menu_book</span>
<span>Homework</span>

<span class="material-symbols-outlined mb-1" data-icon="quiz">quiz</span>

</button>

<span class="material-symbols-outlined mb-1" data-icon="more_horiz">more_horiz</span>
