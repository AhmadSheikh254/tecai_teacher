<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Teacher Hub - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e1e2e4",
                        "surface-container": "#e8edff",
                        "on-secondary-fixed": "#191c1e",
                        "surface-container-high": "#e0e8ff",
                        "tertiary-container": "#a33500",
                        "surface-dim": "#cadaff",
                        "on-primary-container": "#c4d2ff",
                        "outline-variant": "#c3c6d6",
                        "on-tertiary-fixed-variant": "#812800",
                        "primary-fixed-dim": "#b2c5ff",
                        "surface-container-highest": "#d7e2ff",
                        "secondary": "#5c5f60",
                        "on-secondary-container": "#606365",
                        "tertiary": "#7b2600",
                        "secondary-fixed-dim": "#c5c6c8",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ffc6b2",
                        "tertiary-fixed": "#ffdbcf",
                        "on-surface": "#041b3c",
                        "primary-container": "#0052cc",
                        "surface-variant": "#d7e2ff",
                        "background": "#f9f9ff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#edf0ff",
                        "inverse-primary": "#b2c5ff",
                        "surface-tint": "#0c56d0",
                        "tertiary-fixed-dim": "#ffb59b",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dae2ff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001848",
                        "on-tertiary-fixed": "#380d00",
                        "on-background": "#041b3c",
                        "primary": "#003d9b",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline": "#737685",
                        "secondary-container": "#dee0e2",
                        "on-surface-variant": "#434654",
                        "surface-container-low": "#f1f3ff",
                        "on-secondary-fixed-variant": "#444749",
                        "inverse-surface": "#1d3052",
                        "on-primary-fixed-variant": "#0040a2",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9ff",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "xl": "32px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "8px",
                        "sm": "8px",
                        "card-gap": "12px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Split Layout Container -->
<main class="w-full flex">
<!-- Left Side: Brand Imagery (Hidden on small screens) -->
<section class="hidden lg:flex lg:w-5/12 xl:w-1/2 relative bg-surface-container-highest flex-col justify-end p-xl overflow-hidden">
<!-- Background Image -->
<img class="absolute inset-0 w-full h-full object-cover z-0" data-alt="A brightly lit, modern classroom bathed in soft morning sunlight. The focus is on a sleek, minimalist teacher's desk with a laptop and beautifully organized grading materials. The overall color palette is dominated by calm whites, soft blues, and natural wood tones, conveying a sense of serene professional authority and educational excellence in a premium light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz4Qrm1dULKL_2NB5tFUf2Dtq5m68v_Rg-w0oHpPz496qbb4DH_TaOFOQn9o-V6vaQvEnLBwD5nzmuJ6QE6Ow9_a_L4fIvudnavhiYeLOn0H6XTtlFI3cvsJyLUWmyGzy1M2Oc1GUSET39lptqZMNXQ_HWdjY0oOCVpRCKUyq5x9EO0d3QyypUkPd4GiMFmdUTFVDeBmszN1hS-JPhzXN2TrR7yGxWF9-FwJVf2DxTvnCTA9lQJEtXcA"/>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/90 via-inverse-surface/40 to-transparent z-10"></div>
<!-- Brand Message -->
<div class="relative z-20 text-inverse-on-surface mb-xl max-w-lg">
<div class="flex items-center gap-base mb-md">
<span class="material-symbols-outlined text-display" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-display text-display">Teacher Hub</h1>
</div>
<p class="font-body-lg text-body-lg opacity-90">Empowering educators with intuitive tools to manage classrooms, track progress, and inspire students with minimal administrative friction.</p>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full lg:w-7/12 xl:w-1/2 flex items-center justify-center p-container-margin md:p-xl lg:p-20 relative">
<!-- Mobile Brand Header (Visible only on small screens) -->
<div class="absolute top-8 left-container-margin lg:hidden flex items-center gap-sm text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-headline-md text-headline-md">Teacher Hub</span>
</div>
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_8px_24px_rgba(0,0,0,0.08)] p-lg md:p-xl flex flex-col gap-xl border border-surface-container-high/50">
<!-- Header -->
<div class="flex flex-col gap-xs">
<h2 class="font-headline-lg text-headline-lg md:font-display md:text-display text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Input Group: Email/Employee ID -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Email/Employee ID</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">person</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-11 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="identifier" placeholder="Enter your email or ID" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-11 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center w-4 h-4 rounded border border-outline-variant bg-surface-container-lowest group-hover:border-primary transition-colors">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[14px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity absolute pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-sm hover:bg-surface-tint hover:shadow-md active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Sign Up -->
<div class="text-center mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-primary hover:text-surface-tint hover:underline transition-all" href="#">Sign Up</a>
</p>
</div>
</div>
</section>
</main>
</body></html>
