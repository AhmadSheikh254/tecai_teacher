<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9ff; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-background text-on-background min-h-screen flex flex-col relative pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface-dim shadow-sm flex justify-between items-center px-container-margin h-16 w-full z-50">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden active:scale-95 transition-transform hover:bg-surface-container-high transition-colors duration-200 cursor-pointer">
<img alt="teacher profile picture" class="w-full h-full object-cover" data-alt="A professional headshot of a teacher, looking friendly and approachable, well-lit studio photography, soft neutral background, wearing a smart casual blazer, high quality, 8k resolution, photorealistic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3_lrwcrxr8nOo2F32v2Q1Wtd9tiSCvUTb6aW89U5lNdNhBRis3CBGEYDpd139HstNbV99wMZfSgoHkuFo8kkwgyOA_K0cgUqNsaVcx5c9kWfI4T5h2lGq0yvqAnQtAnAr-TJpWhYUb9bmUf7SRcoVyqOnzePhIR_JwILYOj7_qr9NgNGw-UVW_d541_T7hc-F8KxZ7YLGekDdowSIT2q5A3eIZuHWD6_qAaHFvpgem0CtntUJSywG5A"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-primary-container">Teacher Hub</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary dark:text-primary-fixed-dim active:scale-95 transition-transform hover:bg-surface-container-high transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-container-margin py-lg space-y-xl max-w-4xl mx-auto w-full">
<!-- Page Header -->
<div class="mb-lg pt-4">
<h2 class="font-display text-display text-on-surface mb-xs">Computer Based Testing System</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Manage and create robust assessments for your students.</p>
</div>
<!-- Modules Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Question Bank Card -->
<button class="group bg-surface-container-lowest rounded-xl p-lg text-left shadow-[0px_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0px_8px_24px_rgba(0,0,0,0.08)] transition-all duration-300 relative overflow-hidden border border-transparent hover:border-primary-container/20 flex flex-col h-64">
<div class="absolute top-0 right-0 p-lg opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-[120px] text-primary" style="font-variation-settings: 'FILL' 1;">database</span>
</div>
<div class="w-12 h-12 rounded-xl bg-surface-container text-primary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">database</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-on-surface mb-xs relative z-10">Question Bank</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-auto relative z-10 max-w-[80%]">
                    Create, organize, and review test items. Supports multiple choice, essay, and interactive formats.
                </p>
<div class="flex items-center gap-xs text-primary font-label-md text-label-md uppercase tracking-wider relative z-10 mt-md">
<span>Manage Repository</span>
<span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
<!-- Exam Card -->
<button class="group bg-surface-container-lowest rounded-xl p-lg text-left shadow-[0px_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0px_8px_24px_rgba(0,0,0,0.08)] transition-all duration-300 relative overflow-hidden border border-transparent hover:border-primary-container/20 flex flex-col h-64">
<div class="absolute top-0 right-0 p-lg opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-[120px] text-primary" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div class="w-12 h-12 rounded-xl bg-surface-container text-primary flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-on-surface mb-xs relative z-10">Exam</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-auto relative z-10 max-w-[80%]">
                    Assemble exams from the bank, set grading rules, schedule sessions, and monitor live tests.
                </p>
<div class="flex items-center gap-xs text-primary font-label-md text-label-md uppercase tracking-wider relative z-10 mt-md">
<span>Launch &amp; Monitor</span>
<span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
</div>
<!-- Recent Activity Section (Supplemental) -->
<div class="mt-xl">
<h3 class="font-headline-md text-headline-md text-on-surface mb-md">Recent Assessments</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="p-md border-b border-surface-container flex items-center justify-between hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container text-secondary flex items-center justify-center">
<span class="material-symbols-outlined">quiz</span>
</div>
<div>
<p class="font-headline-md text-[16px] leading-[24px] text-on-surface">Midterm: Advanced Physics</p>
<p class="font-body-md text-body-md text-on-surface-variant">Completed yesterday • 32 Students</p>
</div>
</div>
<span class="px-3 py-1 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-[10px]">GRADED</span>
</div>
<div class="p-md flex items-center justify-between hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container text-secondary flex items-center justify-center">
<span class="material-symbols-outlined">pending_actions</span>
</div>
<div>
<p class="font-headline-md text-[16px] leading-[24px] text-on-surface">Pop Quiz: Organic Chem</p>
<p class="font-body-md text-body-md text-on-surface-variant">Scheduled for 14:00 today</p>
</div>
</div>
<span class="px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-[10px]">UPCOMING</span>
</div>
</div>
</div>
</main>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface dark:bg-surface-container-highest shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<!-- Assignment (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined mb-1">assignment</span>
<span class="font-label-md text-label-md">Assignment</span>
</button>
<!-- Homework (Inactive) -->

<span class="material-symbols-outlined mb-1">menu_book</span>
<span class="font-label-md text-label-md">Homework</span>
</button>
<!-- CBTS (Active) -->

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">quiz</span>
<span class="font-label-md text-label-md">CBTS</span>
</button>
<!-- More (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined mb-1">more_horiz</span>
<span class="font-label-md text-label-md">More</span>
</button>
</nav>
<!-- Desktop Side Nav (Visible only on md screens and up) - Semantic Shell Concept -->
<aside class="hidden md:flex flex-col fixed left-0 top-16 h-[calc(100vh-64px)] w-64 bg-surface dark:bg-surface-container-highest shadow-[4px_0px_12px_rgba(0,0,0,0.05)] z-40 p-4 gap-2">
<!-- Home -->
<button class="flex items-center gap-3 text-on-surface-variant dark:text-outline-variant px-4 py-3 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all text-left">
<span class="material-symbols-outlined">home</span>
<span class="font-body-md text-[16px] font-semibold">Home</span>
</button>
<!-- Assignment -->
<button class="flex items-center gap-3 text-on-surface-variant dark:text-outline-variant px-4 py-3 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all text-left">
<span class="material-symbols-outlined">assignment</span>
<span class="font-body-md text-[16px] font-semibold">Assignment</span>
</button>
<!-- Homework -->
<button class="flex items-center gap-3 text-on-surface-variant dark:text-outline-variant px-4 py-3 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all text-left">
<span class="material-symbols-outlined">menu_book</span>
<span class="font-body-md text-[16px] font-semibold">Homework</span>
</button>
<!-- CBTS (Active) -->
<button class="flex items-center gap-3 bg-primary-container dark:bg-primary-fixed text-on-primary-container dark:text-on-primary-fixed rounded-xl px-4 py-3 transition-all duration-300 text-left">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">quiz</span>
<span class="font-body-md text-[16px] font-semibold">CBTS</span>
</button>
<!-- More -->
<button class="flex items-center gap-3 text-on-surface-variant dark:text-outline-variant px-4 py-3 hover:bg-surface-container dark:hover:bg-surface-variant rounded-xl transition-all text-left mt-auto">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-body-md text-[16px] font-semibold">More</span>
</button>
</aside>
<style>
        /* Adjust main content layout for desktop sidebar */
        @media (min-width: 768px) {
            main { margin-left: 16rem; max-width: calc(100% - 16rem); }
