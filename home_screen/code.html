<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Teacher Hub - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e1e2e4",
                        "surface-container": "#e8edff",
                        "on-secondary-fixed": "#191c1e",
                        "surface-container-high": "#e0e8ff",
                        "tertiary-container": "#a33500",
                        "surface-dim": "#cadaff",
                        "on-primary-container": "#c4d2ff",
                        "outline-variant": "#c3c6d6",
                        "on-tertiary-fixed-variant": "#812800",
                        "primary-fixed-dim": "#b2c5ff",
                        "surface-container-highest": "#d7e2ff",
                        "secondary": "#5c5f60",
                        "on-secondary-container": "#606365",
                        "tertiary": "#7b2600",
                        "secondary-fixed-dim": "#c5c6c8",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ffc6b2",
                        "tertiary-fixed": "#ffdbcf",
                        "on-surface": "#041b3c",
                        "primary-container": "#0052cc",
                        "surface-variant": "#d7e2ff",
                        "background": "#f9f9ff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#edf0ff",
                        "inverse-primary": "#b2c5ff",
                        "surface-tint": "#0c56d0",
                        "tertiary-fixed-dim": "#ffb59b",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dae2ff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001848",
                        "on-tertiary-fixed": "#380d00",
                        "on-background": "#041b3c",
                        "primary": "#003d9b",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline": "#737685",
                        "secondary-container": "#dee0e2",
                        "on-surface-variant": "#434654",
                        "surface-container-low": "#f1f3ff",
                        "on-secondary-fixed-variant": "#444749",
                        "inverse-surface": "#1d3052",
                        "on-primary-fixed-variant": "#0040a2",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9ff",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "xl": "32px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "8px",
                        "sm": "8px",
                        "card-gap": "12px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-background text-on-background antialiased pt-16 pb-24">
<!-- TopAppBar -->
<header class="bg-surface fixed top-0 w-full shadow-sm flex justify-between items-center px-container-margin h-16 z-50">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high">
<img alt="teacher profile picture" class="w-full h-full object-cover" data-alt="A highly detailed close up portrait of a professional female teacher with a warm, welcoming smile. She is in her early 30s with styled brunette hair. The lighting is bright and even, characteristic of a premium, modern light-mode corporate portrait. The background is a soft, out-of-focus white and light blue gradient." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCP8Fes6Wf9DdkJS-k33oTvc53T3DDc43ixr_T8hwh_pr7sY__yCD2W_7u82_wSOmxr5bh8BWjPCpfyruGFXgrPxwBnxu3LTADJnrW1Pyal-Qu22X6blXtzKTJ1Qq9MSu3lKFCjAiSBqPq2uZCCOWWLFfJ_afO1UosCa0JnsAyjMZTLqPq-T2HkOCTCMpG_U0QCY9cje_vqA6rxLx33tk9UUSBSy0TQyKocGDGSGQPP-eLL9BRYsDjQTw"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Teacher Hub</h1>
</div>
<button class="text-primary hover:bg-surface-container-high transition-colors duration-200 active:scale-95 transition-transform w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Canvas -->
<main class="px-container-margin mt-lg max-w-4xl mx-auto space-y-lg">
<!-- Welcome Section -->
<section>
<h2 class="font-display text-display text-on-background">Good Morning, Sarah</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Here is what's happening today.</p>
</section>
<!-- Quick Actions -->
<section class="grid grid-cols-4 gap-sm">
<button class="flex flex-col items-center gap-xs active:scale-95 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" data-icon="add_task">add_task</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center leading-tight">New<br/>Assign</span>
</button>
<button class="flex flex-col items-center gap-xs active:scale-95 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-surface-container-high text-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" data-icon="checklist">checklist</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center leading-tight">Take<br/>Attend</span>
</button>
<button class="flex flex-col items-center gap-xs active:scale-95 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-surface-container-high text-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center leading-tight">Message<br/>Class</span>
</button>
<button class="flex flex-col items-center gap-xs active:scale-95 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-surface-container-high text-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center leading-tight">Schedule</span>
</button>
</section>
<!-- At a Glance Stats (Bento Grid) -->
<section>
<h3 class="font-headline-md text-headline-md text-on-surface mb-md">At a Glance</h3>
<div class="grid grid-cols-2 gap-sm">
<!-- Large Card -->
<div class="col-span-2 bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-container flex justify-between items-center relative overflow-hidden">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-surface-container-high rounded-full opacity-50"></div>
<div class="relative z-10">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Classes Today</p>
<p class="font-display text-display text-primary mt-xs">4</p>
</div>
<div class="relative z-10 bg-primary-container text-on-primary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="school">school</span>
</div>
</div>
<!-- Small Cards -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-container flex flex-col justify-between">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Ungraded</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-error mt-sm">12</p>
</div>
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-container flex flex-col justify-between">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Avg Attend</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-primary mt-sm">94%</p>
</div>
</div>
</section>
<!-- Recent Activity (Skeletons) -->
<section>
<div class="flex justify-between items-center mb-md">
<h3 class="font-headline-md text-headline-md text-on-surface">Recent Activity</h3>
<button class="font-label-md text-label-md text-primary tracking-wider uppercase">View All</button>
</div>
<div class="space-y-sm">
<!-- Skeleton Item 1 -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex gap-md items-center animate-pulse">
<div class="w-10 h-10 rounded-full bg-surface-container-high shrink-0"></div>
<div class="flex-1 space-y-xs">
<div class="h-4 bg-surface-container-high rounded w-3/4"></div>
<div class="h-3 bg-surface-container-high rounded w-1/2"></div>
</div>
</div>
<!-- Skeleton Item 2 -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex gap-md items-center animate-pulse" style="animation-delay: 150ms;">
<div class="w-10 h-10 rounded-full bg-surface-container-high shrink-0"></div>
<div class="flex-1 space-y-xs">
<div class="h-4 bg-surface-container-high rounded w-2/3"></div>
<div class="h-3 bg-surface-container-high rounded w-1/3"></div>
</div>
</div>
</div>
</section>
<!-- Announcements (Skeletons) -->
<section class="pb-lg">
<h3 class="font-headline-md text-headline-md text-on-surface mb-md">Announcements</h3>
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] animate-pulse border-l-4 border-primary">
<div class="h-5 bg-surface-container-high rounded w-1/3 mb-sm"></div>
<div class="space-y-2">
<div class="h-3 bg-surface-container-high rounded w-full"></div>
<div class="h-3 bg-surface-container-high rounded w-5/6"></div>
<div class="h-3 bg-surface-container-high rounded w-4/6"></div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] shadow-lg fixed bottom-0 w-full rounded-t-xl fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe md:hidden">
<!-- Active: Home -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-3 py-1.5 transition-all duration-300 active:scale-90 w-16">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1" data-icon="home" data-weight="fill">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<!-- Inactive: Assignment -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:bg-surface-container rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-label-md text-label-md mt-1">Assign</span>
</button>
<!-- Inactive: Homework -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:bg-surface-container rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-md text-label-md mt-1">HW</span>
</button>
<!-- Inactive: CBTS -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:bg-surface-container rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined" data-icon="quiz">quiz</span>
<span class="font-label-md text-label-md mt-1">CBTS</span>
</button>
<!-- Inactive: More -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:bg-surface-container rounded-xl transition-all active:scale-90 transition-transform duration-200 w-16">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-label-md text-label-md mt-1">More</span>
</button>
</nav>
</body></html>
